packages:
  - apps/*
  - packages/*
  - tools/*
  - docs

allowBuilds:
  esbuild: true

catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@types/node": ^24
  publint: ^0.3.24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3

catalogMode: prefer
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
