packages:
  - apps/*
  - packages/*
  - tools/*
  - docs

allowBuilds:
  "0": "@parcel/watcher"
  "1": better-sqlite3
  "2": esbuild
  "3": sharp
  "4": vue-demi

catalog:
  "@types/node": ^24
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
